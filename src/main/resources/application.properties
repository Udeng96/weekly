server.servlet.context-path=/weekly
server.port=8083

spring.mvc.static-path-pattern=/static/**
spring.thymeleaf.prefix=classpath:templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=300000

spring.jpa.properties.hibernate.jdbc.batch_size=11
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.hibernate.ddl-auto=none

spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
